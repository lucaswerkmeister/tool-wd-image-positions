{% macro depicted_div(depicted, highlighted_iiif_regions=[]) %}
<div class="wd-image-positions--depicted wd-image-positions--depicted__{{ depicted.property_id }}{% if depicted.iiif_region in highlighted_iiif_regions %} wd-image-positions--depicted__highlighted{% endif %}"
     title="{{ depicted.label.value }}{% if 'item_id' in depicted %} ({{ depicted.item_id }}){% endif %}"
     style="{{ depicted.iiif_region | iiif_region_to_style }}"
     data-statement-id="{{ depicted.statement_id }}"
     data-qualifier-hash="{{ depicted.qualifier_hash }}">
  {{ depicted | depicted_item_link }}
</div>
{% endmacro %}
